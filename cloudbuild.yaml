substitutions:
  _REGION: us-central1
  _REPOSITORY: betterpptx-mcp
  _MCP_SERVICE: betterpptx-mcp-staging
  _WEBHOOK_SERVICE: betterpptx-dodo-webhook-staging
  _WEBHOOK_SERVICE_ACCOUNT: bpptx-dodo-wh-runtime@betterpptx-mcp-staging.iam.gserviceaccount.com
  _WEBHOOK_SECRET_NAME: betterpptx-dodo-webhook-secret
  _WEBHOOK_CUSTOM_HEADER: X-BetterPPTX-Dodo-Webhook-Token
  _WEBHOOK_CUSTOM_TOKEN_SECRET_NAME: betterpptx-dodo-webhook-custom-token

steps:
  - id: build-mcp
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/docker/Dockerfile.mcp
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_MCP_SERVICE}:${SHORT_SHA}
      - .

  - id: push-mcp
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_MCP_SERVICE}:${SHORT_SHA}

  - id: deploy-mcp
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - ${_MCP_SERVICE}
      - --project=${PROJECT_ID}
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_MCP_SERVICE}:${SHORT_SHA}
      - --port=8080
      - --quiet

  - id: build-dodo-webhook
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/docker/Dockerfile.dodo-webhook
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_WEBHOOK_SERVICE}:${SHORT_SHA}
      - .

  - id: push-dodo-webhook
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_WEBHOOK_SERVICE}:${SHORT_SHA}

  - id: deploy-dodo-webhook
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_WEBHOOK_SERVICE}
      - --project=${PROJECT_ID}
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_WEBHOOK_SERVICE}:${SHORT_SHA}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=${_WEBHOOK_SERVICE_ACCOUNT}
      - --port=8080
      - --cpu=1
      - --memory=512Mi
      - --concurrency=20
      - --min-instances=0
      - --max-instances=2
      - --timeout=60s
      - --set-env-vars=BETTERPPTX_BILLING_LEDGER_STORE=firestore,BETTERPPTX_FIRESTORE_BILLING_COLLECTION_PREFIX=betterpptx_billing,BETTERPPTX_GCP_PROJECT=${PROJECT_ID},BETTERPPTX_DODO_WEBHOOK_CUSTOM_HEADER=${_WEBHOOK_CUSTOM_HEADER},BETTERPPTX_WEBHOOK_RATE_LIMIT_MAX=120,BETTERPPTX_WEBHOOK_RATE_LIMIT_WINDOW_MS=60000
      - --set-secrets=DODO_PAYMENTS_WEBHOOK_SECRET=${_WEBHOOK_SECRET_NAME}:latest,BETTERPPTX_DODO_WEBHOOK_CUSTOM_TOKEN=${_WEBHOOK_CUSTOM_TOKEN_SECRET_NAME}:latest
      - --quiet

options:
  logging: CLOUD_LOGGING_ONLY
