apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: betterpptx-avatar-worker
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "false"
        autoscaling.knative.dev/maxScale: "1"
    spec:
      serviceAccountName: betterpptx-avatar-worker@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 1
      timeoutSeconds: 900
      containers:
        - name: avatar-worker
          image: REGION-docker.pkg.dev/PROJECT_ID/betterpptx/betterpptx-avatar-musetalk:TAG
          ports:
            - name: http1
              containerPort: 7860
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "7860"
            - name: AVATAR_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: betterpptx-avatar-worker-token
                  key: latest
            - name: AVATAR_MODEL_DIR
              value: /models
            - name: AVATAR_CACHE_DIR
              value: /cache
          resources:
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: 7860
            periodSeconds: 10
            failureThreshold: 60
          volumeMounts:
            - name: avatar-models
              mountPath: /models
              readOnly: true
            - name: avatar-cache
              mountPath: /cache
      nodeSelector:
        run.googleapis.com/accelerator: nvidia-l4
      volumes:
        - name: avatar-models
          csi:
            driver: gcsfuse.run.googleapis.com
            readOnly: true
            volumeAttributes:
              bucketName: BETTERPPTX_AVATAR_MODELS_BUCKET
        - name: avatar-cache
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
