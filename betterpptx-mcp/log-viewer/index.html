<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>betterpptx-mcp MCP Log Viewer</title>
	<link rel="stylesheet" href="./styles.css">
</head>
<body>
	<header class="topbar">
		<div>
			<h1>betterpptx-mcp MCP Log Viewer</h1>
			<div id="fileMeta" class="meta">No log loaded</div>
		</div>
		<div class="topActions">
			<span id="liveStatus" class="liveStatus">Live: off</span>
			<button id="liveButton" type="button">Start live</button>
			<label class="fileButton">
				<input id="fileInput" type="file" accept=".ndjson,.jsonl,.log,.txt" multiple>
				Open logs
			</label>
		</div>
	</header>

	<main id="dropZone" class="shell">
		<section class="metrics" aria-label="Log summary">
			<div class="metric"><span id="totalCount">0</span><small>events</small></div>
			<div class="metric"><span id="toolCount">0</span><small>tool calls</small></div>
			<div class="metric"><span id="errorCount">0</span><small>errors</small></div>
			<div class="metric"><span id="avgDuration">0 ms</span><small>avg duration</small></div>
			<div class="metric"><span id="sessionCount">0</span><small>groups</small></div>
		</section>

		<section class="controls" aria-label="Filters">
			<label>
				Type
				<select id="typeFilter">
					<option value="">All</option>
				</select>
			</label>
			<label>
				Search
				<input id="textFilter" type="search" placeholder="tool, id, error, path">
			</label>
			<label>
				Group
				<select id="groupMode">
					<option value="sessionId">Client session</option>
					<option value="requestId">Request</option>
					<option value="callId">Tool call</option>
					<option value="pid">Process</option>
					<option value="type">Type</option>
				</select>
			</label>
			<label class="check">
				<input id="errorOnly" type="checkbox">
				Errors only
			</label>
			<button id="clearButton" type="button">Clear</button>
		</section>

		<section class="workspace">
			<aside class="groups" aria-label="Event groups">
				<div class="panelHead">
					<h2>Groups</h2>
					<span id="visibleCount">0 shown</span>
				</div>
				<div id="groupList" class="groupList"></div>
			</aside>

			<section class="events" aria-label="Events">
				<div class="panelHead">
					<h2 id="mainPanelTitle">Conversation</h2>
					<div class="viewToggle" aria-label="View mode">
						<button id="conversationViewButton" type="button">Conversation</button>
						<button id="timelineViewButton" type="button">Timeline</button>
					</div>
					<span id="timeRange">-</span>
				</div>
				<div id="conversationView" class="conversationWrap">
					<div id="conversationList" class="conversationList"></div>
				</div>
				<div id="timelineView" class="tableWrap hidden">
					<table>
						<thead>
							<tr>
								<th>Time</th>
								<th>Type</th>
								<th>Name</th>
								<th>ID</th>
								<th>ms</th>
								<th>Summary</th>
							</tr>
						</thead>
						<tbody id="eventRows"></tbody>
					</table>
				</div>
			</section>

			<aside class="details" aria-label="Event details">
				<div class="panelHead">
					<h2>Details</h2>
					<button id="copyButton" type="button">Copy JSON</button>
				</div>
				<pre id="detailPane">{}</pre>
			</aside>
		</section>
	</main>

	<script src="./app.js"></script>
</body>
</html>
